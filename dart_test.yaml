# Test tags. `golden` marks the machine-local visual baseline in
# test/golden/ — captured on one machine with the Ahem test font, so glyph
# metrics differ on other platforms. CI runs `--exclude-tags "golden || scenario"`
# (one selector: this Flutter keeps only the last repeated flag); a bare
# `flutter test` still runs them locally.
tags:
  golden:
    description: Machine-local visual baselines; excluded from CI.
  # `scenario` marks test/scenario/: the real app rendered with real fonts and
  # written out as PNGs for a human to look at. Nothing is compared, so CI
  # skips them.
  scenario:
    description: Screenshot scenarios written to ARC_FINAL_OUT; excluded from CI.
