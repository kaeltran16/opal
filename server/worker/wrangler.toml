name = "opal-worker"
main = "src/worker.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

[vars]
CORS_ORIGINS = ""

[[d1_databases]]
binding = "DB"
database_name = "opal"
database_id = "PLACEHOLDER_SET_BY_WRANGLER_D1_CREATE"
migrations_dir = "migrations"

[[ratelimits]]
name = "RL"
namespace_id = "2001"
simple = { limit = 60, period = 60 }
