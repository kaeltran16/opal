name = "opal-worker"
main = "src/worker.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
alias = { "zod" = "./node_modules/zod/index.js" }

[vars]
CORS_ORIGINS = "http://localhost:8080"
OPENROUTER_BASE_URL = "https://openrouter.ai/api/v1"
PAL_MODEL = "deepseek/deepseek-v4.1-flash"
PAL_REQUEST_TIMEOUT_MS = "30000"

[[routes]]
pattern = "opal.kael.life"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "opal"
database_id = "495d49f3-d132-44db-ac41-d159d2c363d1"
migrations_dir = "migrations"

[[ratelimits]]
name = "RL"
namespace_id = "2001"
simple = { limit = 60, period = 60 }
